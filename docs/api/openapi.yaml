# 개미비서단 에이전트 계약. OpenAPI 3.1, SwaggerHub에서 관리합니다.
openapi: 3.1.0
info:
  title: 개미비서단 에이전트 계약 명세
  version: 1.0.0-draft.4
  description: |
    MVP 목표 구조(TO-BE) 기준의 API·에이전트 계약입니다. 현재 코드가 아니라 구현해야 할 계약을 설명합니다.

    **읽는 법**
    - `paths`에는 실제 HTTP·SSE 엔드포인트만 있습니다.
    - 프로세스 내 함수는 각 태그 설명의 표와 루트의 `x-internal-functions`에 있고, 입출력은 Schemas에 있습니다.
    - 각 오퍼레이션 설명 첫 줄에 상태(유지·변경·신규·제안), 릴리스(MVP·Post-MVP), 전송 방식을 표시합니다.
    - `x-` 필드는 OpenAPI 확장이며, 도구에서 읽기 위한 같은 정보입니다.

    **응답 규칙**
    - 업무 결과는 HTTP 200과 `status`(`ok`·`partial`·`rejected`·`clarification_needed`·`job_started`)로 구분합니다.
    - 인프라·정책 오류는 HTTP 4xx/5xx와 RFC 9457 `application/problem+json`으로 반환합니다.
    - `user_id`는 세션에서 주입하며, 요청 바디로 받지 않습니다.

    **기준 문서 우선순위**
    1. 멀티에이전트 설계 최종 확정(10/14) 2. MVP 기술 설계 문서·PRD(10/27) 3. 시그니처 계약 4. 각 에이전트 수정안(10/3)

    11/4 결정(관계 사전 MVP 포함)과 11/5 결정(자유 질의·2종목 비교는 MVP 이후)을 반영했습니다.

    **출처:** 토론 수정안 v2.3, 데이터 수정안, 시뮬레이션 수정안, 오케스트레이터 설계 초안, 시그니처 계약.
  x-open-questions:
  - id: OQ-1
    topic: envelope.py 대조
    detail: 시그니처 계약은 backend/orchestrator/envelope.py 구현 완료로 적혀 있으나 저장소 어느 브랜치에도 없습니다. NextAction의 payload 구조를 파일과 대조해야 합니다.
  - id: OQ-2
    topic: 오류 코드 누락
    detail: 정책표에 404와 잘못된 job 상태용 코드가 없어 job_not_found, invalid_job_state를 제안했습니다.
  - id: OQ-3
    topic: FE용 종목 검색 경로
    detail: 자동완성 10개가 확정됐지만 search_companies의 HTTP 경로가 없어 GET /companies/search를 제안했습니다.
  - id: OQ-4
    topic: 시뮬레이션 버튼 활성화 정보
    detail: FE가 sim_params 유무로 버튼을 비활성화해야 하지만 노출 필드가 없어 DataStatus.simulation_ready를 제안했습니다.
  - id: OQ-5
    topic: 시뮬레이션 결과 필드명
    detail: 수정안은 개념만 정의합니다. impact_pct·ci_low·ci_high·significant·seed·model_id·data_as_of 외 필드명은 제안입니다.
  - id: OQ-7
    topic: 중복 필드
    detail: InsightBoardResult와 TrendReportResult의 status·meta가 봉투와 겹칩니다. 시그니처 계약대로 유지했으며 정리 여부를 결정해야 합니다.
  - id: OQ-8
    topic: 인증 방식
    detail: Design Doc 4.4의 서명 쿠키안을 반영했습니다. 팀 결정 전입니다. 쿠키 인증은 CSRF에 취약하므로 CSRF 토큰 또는 SameSite 정책을 함께 정해야 합니다.
  - id: OQ-9
    topic: 스토리형 온보딩
    detail: 문구 일치 방식(q1~q6)을 question_id·option_id 방식으로 바꾸는 제안입니다. 문항과 환산표는 기능 명세서에서 확정해야 합니다.
  - id: OQ-10
    topic: 트렌드 리포트 카드 목록
    detail: 현재 계약은 종목 1개 생성만 있습니다. 관심 종목·산업 기반 목록의 생성 시점이 정해지면 조회 엔드포인트를 추가해야 합니다.
