  note: KIS 종목투자의견 API 기준입니다. 리포트 ID 연결과 `report_type`은 삭제됐습니다.
- name: get_price_data
  agent: 데이터 에이전트
  summary: 시세 이력 조회
  signature: get_price_data(ticker, date_from=None, date_to=None) -> dict
  input: GetPriceDataInput
  output: PriceData
  status: changed
  release: mvp
  note: 수정주가(pykrx)입니다. `volatility_30d`는 제거됐습니다.
- name: get_macro_data
  agent: 데이터 에이전트
  summary: 매크로 지표 조회
  signature: 'get_macro_data(indicators: list[str] | None = None, date_from=None, date_to=None) -> dict'
  input: GetMacroDataInput
  output: DataRecord
  status: changed
  release: mvp
- name: get_disclosure_data
  agent: 데이터 에이전트
  summary: 공시 조회
  signature: get_disclosure_data(ticker, date_from=None, date_to=None, disclosure_type=None) -> dict
  input: GetDisclosureDataInput
  output: DataRecord
  status: existing
  release: mvp
- name: get_available_data_status
  agent: 데이터 에이전트
  summary: 데이터 보유 상태 조회
  signature: get_available_data_status(ticker) -> dict
  input: GetAvailableDataStatusInput
  output: DataStatus
  status: changed
  release: mvp
- name: get_agent_context
  agent: 데이터 에이전트
  summary: 에이전트별 근거 묶음 조회
  signature: 'get_agent_context(ticker: str, agent_type: str, query: str | None = None, intent: str | None = None) -> dict'
  input: GetAgentContextInput
  output: GetAgentContextOutput
  status: changed
  release: mvp
  note: '`intent`는 아젠다 ID와 같습니다. `data_tier`는 항상 포함합니다. 시뮬레이션은 `intent` 없이 호출합니다.'
- name: get_financials
  agent: 데이터 에이전트
  summary: 재무제표 조회
  signature: 'get_financials(ticker: str, period_type: str = "quarter", date_from: str | None = None, date_to: str | None
    = None) -> dict'
  input: GetFinancialsInput
  output: DataRecord
  status: new
  release: mvp
  note: dart-fss 기반이며 공시 접수일 기준으로 시점 오염을 막습니다.
- name: get_market_snapshot
  agent: 데이터 에이전트
  summary: 시장·업종 종목 목록 조회
  signature: 'get_market_snapshot(sector: str | None = None, top_n: int = 20, sort_by: str = "market_cap") -> dict'
  input: GetMarketSnapshotInput
  output: DataRecord
  status: new
  release: mvp
- name: ensure_company_data
  agent: 데이터 에이전트
  summary: 심층 수집 예약
  signature: 'ensure_company_data(ticker: str, user_id: str | None = None) -> dict'
  input: EnsureCompanyDataInput
  output: EnsureCompanyDataOutput
  status: new
  release: post-mvp
  note: 예약만 하고 즉시 반환합니다. 부작용이 있어 플래너가 직접 호출하지 않습니다. PRD 초안은 실시간 수집을 Post-MVP로 둡니다.
- name: get_derived_snapshot
  agent: 데이터 에이전트
  summary: 계산 근거 조회
  signature: 'get_derived_snapshot(ticker: str, as_of: str | None = None) -> dict'
  input: GetDerivedSnapshotInput
  output: DerivedSnapshot
  status: new
  release: mvp
  note: 과거 변동성의 단일 계산 지점입니다. 표준편차 × √252로 연율화합니다.
- name: get_metric
  agent: 데이터 에이전트
  summary: 시맨틱 레이어 지표 조회
  signature: 'get_metric(ticker: str, metric_id: str, as_of: str) -> MetricValue'
  input: GetMetricInput
  output: MetricValue
  status: new
  release: mvp
  note: 최종 설계 6장의 계약입니다. PER·PBR·ROE처럼 매일 바뀌는 값은 노드에 저장하지 않고 이 함수로 조회합니다.
- name: run_simulation
  agent: 시뮬레이션 에이전트
  summary: 시뮬레이션 실행 함수
  signature: run_simulation(ticker, user_id, job_id)
  input: RunSimulationInput
  output: RunSimulationOutput
  status: changed
  release: mvp
  note: '`job_id`로 토론 결과를 직접 조회해 `macro`·`risk` 아젠다를 ID로 추출합니다. 둘 다 없으면 what-if 없이 기본 분포만 제공합니다.'
- name: run_trend_report
  agent: 트렌드 리포트 에이전트
  summary: 트렌드 리포트 실행 함수
  signature: 'def run_trend_report(self, request: TrendReportRequest) -> TrendReportResult'
  input: TrendReportRequest
  output: TrendReportResult
  status: changed
  release: mvp
  note: '내부 단계: select_evidence, compute_target_price_trend, generate_cards, verify_cards, fill_card_gaps.'
- name: resolve_entities
  agent: 오케스트레이터
  summary: 관문1 종목 확정
  signature: 'def resolve_entities(text: str, max_companies: int = 2) -> EntityResolution'
  input: ResolveEntitiesInput
  output: EntityResolution
  status: new
  release: mvp
- name: run_orchestrator_request
  agent: 오케스트레이터
  summary: 버튼 경로 실행
  signature: 'async def run_orchestrator_request(request: OrchestratorRequest) -> Envelope'
  input: OrchestratorRequest
  output: AnyEnvelope
  status: changed
  release: mvp
  note: '`decide_route`로 라우팅하고 공통 봉투를 반환합니다. 토론은 job 생성 전에 `precheck`를 동기 호출합니다.'
- name: log_uncovered_query
  agent: 오케스트레이터
  summary: 미커버 질의 적재
  signature: 'def log_uncovered_query(event: UncoveredQueryEvent) -> None'
  input: UncoveredQueryEvent
  output: null
  status: new
  release: mvp
- name: make_plan
  agent: 오케스트레이터
  summary: 계획 1회 생성
  signature: 'def make_plan(query: str, entities: EntityResolution, precheck: PrecheckResult | None) -> Plan'
  input: MakePlanInput
  output: Plan
  status: new
  release: post-mvp
- name: run_insight_board
  agent: 인사이트보드 에이전트
  summary: 인사이트보드 실행 함수
  signature: 'async def run_insight_board(companies: list[CompanyContext], feature: InsightBoardFeature, date_from=None, date_to=None)
    -> InsightBoardResult'
  input: RunInsightBoardInput
  output: InsightBoardResult
  status: changed
  release: mvp
  note: '내부 단계: 종목별 병렬 조회, compute_badges, summarize_for_comment, generate_comment, verify_comment.'
- name: precheck
  agent: 토론 에이전트
  summary: 사전 판정(관문2·3)
  signature: 'def precheck(query: str, companies: list[CompanyContext]) -> PrecheckResult'
  input: PrecheckInput
  output: PrecheckResult
  status: new
  release: mvp
  note: LLM 없는 룰 기반 순수 함수이며 목표는 100ms 미만입니다. job 생성 전에 동기 호출합니다.
- name: run_debate
  agent: 토론 에이전트
  summary: 토론 실행 함수
  signature: 'async def run_debate(companies: list[CompanyContext], user_id: str, query: str, precheck: PrecheckResult, job_id:
    str) -> DebateResult'
  input: RunDebateInput
  output: DebateResult
  status: changed
  release: mvp
  note: 작업 큐 워커가 실행합니다. 단계마다 `job_events`를 기록하고 완료 시 상태를 `simulation_pending`으로 바꿉니다.
- name: get_ontology_context
  agent: 관계 사전
  summary: 아젠다별 관계 컨텍스트 조회
  signature: get_ontology_context(ticker, agenda_id) -> OntologyContext
  input: GetOntologyContextInput
  output: OntologyContext
  status: changed
  release: mvp
  note: 토론 job에서 아젠다별 1회 호출해 Bull·Bear·Judge가 같은 결과를 공유합니다. 입장·성향별 필터는 없습니다.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: httpOnly 서명 쿠키입니다. 브라우저 EventSource가 Authorization 헤더를 보낼 수 없어 제안된 방식입니다(OQ-8). `POST /users` 응답의 Set-Cookie
        헤더는 참고용 문서입니다.
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    Ticker:
      name: ticker
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TickerValue'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthenticated:
      description: 로그인 필요
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidRequest:
      description: 요청 형식 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 대상이 없거나 본인 소유가 아님
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 동시 실행 한도 초과 또는 잘못된 job 상태
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 일일 한도 초과
      headers:
        Retry-After:
          schema:
            type: integer
          description: 재시도까지 남은 초
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpstreamUnavailable:
      description: 외부 서비스 장애
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: 내부 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    TickerValue:
      type: string
      pattern: ^[0-9A-Z]{6}$
      examples:
      - 005930
    NullableDate:
      type:
      - string
      - 'null'
      format: date
    Tier:
      type: string
      enum:
      - T0
      - T1
      - T2
    AgendaId:
      type: string
      enum:
      - valuation
      - macro
      - risk
      - growth
      - shareholder_return
      - flow
    DataTier:
      type: string
      enum:
      - report
      - news_only
      - disclosure_only
      - derived_only
      - macro_only
    RiskProfile:
      type: string
      enum:
      - conservative
      - moderate_conservative
      - moderate
      - aggressive
      - very_aggressive
    InsightBoardFeature:
      type: string
      enum:
      - price
      - macro
      - disclosure
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - debate_completed
      - simulation_pending
      - simulation_running
      - completed
      - failed
    ResponseMeta:
      type: object
      required:
      - trace_id
      - data_as_of
      - generated_at
      properties:
        trace_id:
          type: string
        data_as_of:
          type:
          - string
          - 'null'
          description: 기준일. 해당 없을 때만 null을 명시합니다.
        generated_at:
          type: string
          format: date-time
        prompt_version:
          type:
          - string
          - 'null'
        model:
          type:
          - string
          - 'null'
    ReasonCode:
      type: string
      enum:
      - uncovered_company
      - no_data
      - company_not_found
      - too_many_companies
      - partial_coverage
      - out_of_scope_topic
      - data_collecting
      - partial_result
      - unauthenticated
      - invalid_request
      - concurrent_job_limit
      - rate_limited
      - upstream_unavailable
      - internal_error
      - job_not_found
      - invalid_job_state
      description: 마지막 두 값은 제안입니다(OQ-2). 사용자 문구는 reason.message를 사용합니다.
    NextAction:
      description: 사유 코드와 1:1로 대응합니다(REASON_POLICY).
      oneOf:
      - type: object
        title: choose_alternative_company
        required:
        - type
        - payload
        properties:
          type:
            const: choose_alternative_company
          payload:
            type: object
            required:
            - alternatives
            properties:
              alternatives:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/Candidate'
      - type: object
        title: rephrase_company
        required:
        - type
        properties:
          type:
            const: rephrase_company
      - type: object
        title: select_companies
        required:
        - type
        - payload
        properties:
          type:
            const: select_companies
          payload:
            type: object
            required:
            - candidates
            - max_select
            properties:
              candidates:
                type: array
                minItems: 3
                items:
                  $ref: '#/components/schemas/Candidate'
              max_select:
                const: 2
      - type: object
        title: run_single_analysis
        required:
        - type
        - payload
        properties:
          type:
            const: run_single_analysis
          payload:
            type: object
            required:
            - company
            properties:
              company:
                $ref: '#/components/schemas/CompanyContext'
      - type: object
        title: choose_supported_topic
        required:
        - type
        - payload
        properties:
          type:
            const: choose_supported_topic
          payload:
            type: object
            required:
            - topics
            properties:
              topics:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/AgendaId'
      - type: object
        title: check_back_later
        required:
        - type
        properties:
          type:
            const: check_back_later
          payload:
            type: object
            properties:
              ready_at:
                type:
                - string
                - 'null'
                format: date-time
      - type: object
        title: retry_failed_parts
        required:
        - type
        - payload
        properties:
          type:
            const: retry_failed_parts
          payload:
            type: object
            required:
            - failed_parts
            properties:
              failed_parts:
                type: array
                minItems: 1
                items:
                  type: string
      - type: object
        title: login
        required:
        - type
        properties:
          type:
            const: login
      - type: object
        title: fix_input
        required:
        - type
        properties:
          type:
            const: fix_input
          payload:
            type: object
            properties:
              fields:
                type: array
                items:
                  type: string
      - type: object
        title: view_existing_job
        required:
        - type
        - payload
        properties:
          type:
            const: view_existing_job
          payload:
            type: object
            required:
            - job_id
            properties:
              job_id:
                type: string
      - type: object
        title: retry_later
        required:
        - type
        - payload
        properties:
          type:
            const: retry_later
          payload:
            type: object
            required:
            - retry_after_seconds
            properties:
              retry_after_seconds:
                type: integer
                minimum: 1
      - type: object
        title: retry
        required:
        - type
        properties:
          type:
            const: retry
    Reason:
      type: object
      required:
      - code
      - message
      - next_action
      properties:
        code:
          $ref: '#/components/schemas/ReasonCode'
        message:
          type: string
          description: 기술 용어와 코드값을 노출하지 않는 사용자 문구
        next_action:
          $ref: '#/components/schemas/NextAction'
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - reason
      - trace_id
      properties:
        type:
          type: string
          examples:
          - urn:ant-secretariat:problem:rate_limited
        title:
          type: string
        status:
          type: integer
          description: HTTP 상태 코드
        detail:
          type: string
          description: reason.message와 같습니다
        instance:
          type:
          - string
          - 'null'
        reason:
          $ref: '#/components/schemas/Reason'
        trace_id:
          type: string
    JobRef:
      type: object
      required:
      - job_id
      - reused
      properties:
        job_id:
          type: string
        reused:
          type: boolean
          default: false
          description: 진행 중인 기존 작업을 재사용했는지 여부
    Clarification:
      type: object
      required:
      - conversation_id
      - ambiguous
      description: 필드 구조는 PendingClarification 기반 제안입니다. 후보는 채팅 5개가 상한입니다.
      properties:
        conversation_id:
          type: string
        ambiguous:
          type: object
          additionalProperties:
            type: array
            maxItems: 5
            items:
              $ref: '#/components/schemas/Candidate'
    RejectedResponse:
      type: object
      required:
      - status
      - reason
      - meta
      properties:
        status:
          const: rejected
        reason:
          $ref: '#/components/schemas/Reason'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ClarificationResponse:
      type: object
      required:
      - status
      - clarification
      - meta
      properties:
        status:
          const: clarification_needed
        clarification:
          $ref: '#/components/schemas/Clarification'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    JobStartedResponse:
      type: object
      required:
      - status
      - job
      - meta
      properties:
        status:
          const: job_started
        job:
          $ref: '#/components/schemas/JobRef'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    OkInsightBoard:
      type: object
      required:
      - status
      - data
      - meta
      properties:
        status:
          const: ok
        data:
          $ref: '#/components/schemas/InsightBoardResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    PartialInsightBoard:
      type: object
      required:
      - status
      - data
      - reason
      - meta
      properties:
        status:
          const: partial
        data:
          $ref: '#/components/schemas/InsightBoardResult'
        reason:
          $ref: '#/components/schemas/Reason'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    InsightBoardEnvelope:
      oneOf:
      - $ref: '#/components/schemas/OkInsightBoard'
      - $ref: '#/components/schemas/PartialInsightBoard'
      - $ref: '#/components/schemas/RejectedResponse'
      discriminator:
        propertyName: status
        mapping:
          ok: '#/components/schemas/OkInsightBoard'
          partial: '#/components/schemas/PartialInsightBoard'
          rejected: '#/components/schemas/RejectedResponse'
    OkTrendReport:
      type: object
      required:
      - status
      - data
      - meta
      properties:
        status:
          const: ok
        data:
          $ref: '#/components/schemas/TrendReportResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    PartialTrendReport:
      type: object
      required:
      - status
      - data
      - reason
      - meta
      properties:
        status:
          const: partial
        data:
          $ref: '#/components/schemas/TrendReportResult'
        reason:
          $ref: '#/components/schemas/Reason'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    TrendReportEnvelope:
      oneOf:
      - $ref: '#/components/schemas/OkTrendReport'
      - $ref: '#/components/schemas/PartialTrendReport'
      - $ref: '#/components/schemas/RejectedResponse'
      discriminator:
        propertyName: status
        mapping:
          ok: '#/components/schemas/OkTrendReport'
          partial: '#/components/schemas/PartialTrendReport'
          rejected: '#/components/schemas/RejectedResponse'
    DebateStartEnvelope:
      oneOf:
      - $ref: '#/components/schemas/JobStartedResponse'
      - $ref: '#/components/schemas/RejectedResponse'
      discriminator:
        propertyName: status
        mapping:
          job_started: '#/components/schemas/JobStartedResponse'
          rejected: '#/components/schemas/RejectedResponse'
    OkChat:
      type: object
      required:
      - status
      - data
      - meta
      properties:
        status:
          const: ok
        data:
          $ref: '#/components/schemas/ChatAnswer'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ChatEnvelope:
      oneOf:
      - $ref: '#/components/schemas/OkChat'
      - $ref: '#/components/schemas/RejectedResponse'
      - $ref: '#/components/schemas/ClarificationResponse'
      - $ref: '#/components/schemas/JobStartedResponse'
      discriminator:
        propertyName: status
        mapping:
          ok: '#/components/schemas/OkChat'
          rejected: '#/components/schemas/RejectedResponse'
          clarification_needed: '#/components/schemas/ClarificationResponse'
          job_started: '#/components/schemas/JobStartedResponse'
    AnyEnvelope:
      anyOf:
      - $ref: '#/components/schemas/InsightBoardEnvelope'
      - $ref: '#/components/schemas/TrendReportEnvelope'
      - $ref: '#/components/schemas/DebateStartEnvelope'
      - $ref: '#/components/schemas/ChatEnvelope'
    CompanyContext:
      type: object
      required:
      - ticker
      - company
      properties:
        ticker:
          $ref: '#/components/schemas/TickerValue'
        company:
          type: string
        sector:
          type: string
          default: ''
        tier:
          allOf:
