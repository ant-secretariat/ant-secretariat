tags:
- name: 데이터 에이전트
  description: |-
    **역할:** 입력을 종목으로 특정하고(A), 데이터를 수집·정제·저장한 뒤 조회 함수로 제공합니다(B). 결과는 LLM 생성물이 아니라 결정적 데이터입니다.
    **담당:** 수경. **티어:** T0(전종목, 구조화 데이터) · T1(핵심 종목, 심층 근거) · T2(수집 중).

    **내부 함수** (HTTP로 노출하지 않음, 입출력은 Schemas 참고)

    | 함수 | 역할 | 입력 | 출력 | 상태 |
    |---|---|---|---|---|
    | `resolve_company` | 회사명·종목코드를 종목으로 해석 | `ResolveCompanyInput` | `ResolvedCompany` | 변경 · MVP |
    | `search_companies` | 종목 후보 검색 | `SearchCompaniesInput` | `SearchCompaniesOutput` | 신규 · MVP |
    | `extract_company_mentions` | 문장 속 종목 추출 | `ExtractCompanyMentionsInput` | `ExtractCompanyMentionsOutput` | 신규 · MVP |
    | `search_documents` | 문서 벡터 검색 | `SearchDocumentsInput` | `DataRecord` | 유지 · MVP |
    | `get_report_metadata` | 리포트 메타데이터 조회 | `GetReportMetadataInput` | `DataRecord` | 유지 · MVP |
    | `get_report_chunks` | 리포트 청크 조회 | `GetReportChunksInput` | `DataRecord` | 유지 · MVP |
    | `get_target_price_data` | 목표주가와 컨센서스 조회 | `GetTargetPriceDataInput` | `TargetPriceData` | 변경 · MVP |
    | `get_price_data` | 시세 이력 조회 | `GetPriceDataInput` | `PriceData` | 변경 · MVP |
    | `get_macro_data` | 매크로 지표 조회 | `GetMacroDataInput` | `DataRecord` | 변경 · MVP |
    | `get_disclosure_data` | 공시 조회 | `GetDisclosureDataInput` | `DataRecord` | 유지 · MVP |
    | `get_available_data_status` | 데이터 보유 상태 조회 | `GetAvailableDataStatusInput` | `DataStatus` | 변경 · MVP |
    | `get_agent_context` | 에이전트별 근거 묶음 조회 | `GetAgentContextInput` | `GetAgentContextOutput` | 변경 · MVP |
    | `get_financials` | 재무제표 조회 | `GetFinancialsInput` | `DataRecord` | 신규 · MVP |
    | `get_market_snapshot` | 시장·업종 종목 목록 조회 | `GetMarketSnapshotInput` | `DataRecord` | 신규 · MVP |
    | `ensure_company_data` | 심층 수집 예약 | `EnsureCompanyDataInput` | `EnsureCompanyDataOutput` | 신규 · Post-MVP |
    | `get_derived_snapshot` | 계산 근거 조회 | `GetDerivedSnapshotInput` | `DerivedSnapshot` | 신규 · MVP |
    | `get_metric` | 시맨틱 레이어 지표 조회 | `GetMetricInput` | `MetricValue` | 신규 · MVP |
  externalDocs:
    description: 데이터 에이전트 수정안
    url: https://app.notion.com/p/3ee1fad9262e80249779d71906886aa1
- name: 시뮬레이션 에이전트
  description: |-
    **역할:** 토론이 끝난 종목의 30일 뒤 가격 범위를 확률 분포로 보여주고, 금리·환율 시나리오의 변화를 계산합니다. 가격을 맞히는 기능이 아닙니다.
    **모델:** GJR-GARCH + FHS. **담당:** 수경. **실행:** 사용자 버튼, 작업 큐.

    **내부 함수** (HTTP로 노출하지 않음, 입출력은 Schemas 참고)

    | 함수 | 역할 | 입력 | 출력 | 상태 |
    |---|---|---|---|---|
    | `run_simulation` | 시뮬레이션 실행 함수 | `RunSimulationInput` | `RunSimulationOutput` | 변경 · MVP |
  externalDocs:
    description: 시뮬레이션 에이전트 수정안
    url: https://app.notion.com/p/3ee1fad9262e80f49038f22e439c6421
- name: 트렌드 리포트 에이전트
  description: |-
    **역할:** 근거 선별, 목표주가 계산, 카드 생성, L1 검증, 부족 카드 보완을 거쳐 종목 리포트 카드를 만듭니다. 숫자와 방향은 코드가 계산하고 LLM은 설명만 생성합니다.
    **담당:** 태은. **목표:** p95 10초 이내.

    **내부 함수** (HTTP로 노출하지 않음, 입출력은 Schemas 참고)

    | 함수 | 역할 | 입력 | 출력 | 상태 |
    |---|---|---|---|---|
    | `run_trend_report` | 트렌드 리포트 실행 함수 | `TrendReportRequest` | `TrendReportResult` | 변경 · MVP |
  externalDocs:
    description: 시그니처 계약
    url: https://app.notion.com/p/3eb1fad9262e8113bc12f6803670476a
- name: 오케스트레이터
  description: |-
    **역할:** 모든 요청의 진입점입니다. 종목 확정(관문1), 사전 판정 호출, 라우팅, job 생성, 공통 봉투 조합을 담당합니다.
    **패턴:** MVP는 버튼 경로의 결정적 라우팅입니다. 자유 질의는 MVP 이후 범위입니다. **담당:** 태은.

    **내부 함수** (HTTP로 노출하지 않음, 입출력은 Schemas 참고)

    | 함수 | 역할 | 입력 | 출력 | 상태 |
    |---|---|---|---|---|
    | `resolve_entities` | 관문1 종목 확정 | `ResolveEntitiesInput` | `EntityResolution` | 신규 · MVP |
    | `run_orchestrator_request` | 버튼 경로 실행 | `OrchestratorRequest` | `AnyEnvelope` | 변경 · MVP |
    | `log_uncovered_query` | 미커버 질의 적재 | `UncoveredQueryEvent` | `-` | 신규 · MVP |
    | `make_plan` | 계획 1회 생성 | `MakePlanInput` | `Plan` | 신규 · Post-MVP |
  externalDocs:
    description: 오케스트레이터 설계 초안
    url: https://app.notion.com/p/3eb1fad9262e81268d09c98d34f47a39
- name: 인사이트보드 에이전트
  description: |-
    **역할:** 관심 종목별 가격·공시·거시 데이터와 배지를 계산하고 LLM 코멘트 1개를 붙입니다. 종목 일부가 실패해도 나머지를 표시합니다.
    **담당:** 태은.

    **내부 함수** (HTTP로 노출하지 않음, 입출력은 Schemas 참고)

    | 함수 | 역할 | 입력 | 출력 | 상태 |
    |---|---|---|---|---|
    | `run_insight_board` | 인사이트보드 실행 함수 | `RunInsightBoardInput` | `InsightBoardResult` | 변경 · MVP |
  externalDocs:
    description: 시그니처 계약
    url: https://app.notion.com/p/3eb1fad9262e8113bc12f6803670476a
- name: 토론 에이전트
  description: |-
    **역할:** Bull·Bear·Judge가 아젠다별 순차 토론을 하고 근거가 연결된 브리핑을 생성합니다. 사전 판정(관문2·3)도 소유합니다. 매수·매도 권유는 하지 않습니다.
    **흐름:** Bull → Bear → Judge, 점수차가 작으면 조건부 2라운드. **담당:** 유민.

    **내부 함수** (HTTP로 노출하지 않음, 입출력은 Schemas 참고)

    | 함수 | 역할 | 입력 | 출력 | 상태 |
    |---|---|---|---|---|
    | `precheck` | 사전 판정(관문2·3) | `PrecheckInput` | `PrecheckResult` | 신규 · MVP |
    | `run_debate` | 토론 실행 함수 | `RunDebateInput` | `DebateResult` | 변경 · MVP |
  externalDocs:
    description: 토론 에이전트 수정안
    url: https://app.notion.com/p/3ee1fad9262e80b3866be964d84e4631
- name: 관계 사전
  description: |-
    **역할:** 종목·섹터·매크로·이슈의 관계를 읽기 전용 도구로 제공합니다. 원본은 Supabase `ontology_nodes`·`ontology_edges`이며 서버 시작 시 메모리에 로드합니다.
    **담당:** 유민(스키마) · 수경(적재) · 태은(탐색·연결). MVP 시연에서 실제 동작 대상입니다.

    **내부 함수** (HTTP로 노출하지 않음, 입출력은 Schemas 참고)

    | 함수 | 역할 | 입력 | 출력 | 상태 |
    |---|---|---|---|---|
    | `get_ontology_context` | 아젠다별 관계 컨텍스트 조회 | `GetOntologyContextInput` | `OntologyContext` | 변경 · MVP |
  externalDocs:
    description: 온톨로지 프로덕트 기획
    url: https://app.notion.com/p/3e11fad9262e80419c16ed84546cc6ce
- name: 작업
  description: 토론·시뮬레이션 작업의 상태, 결과, 진행 이벤트를 제공합니다.
- name: 사용자와 온보딩
  description: 사용자 등록, 투자 성향 수집, 데모 초기화, 결과 피드백을 제공합니다.
- name: 운영
  description: 헬스 체크입니다.
paths:
  /health:
    get:
      tags:
      - 운영
      operationId: healthCheck
      summary: 헬스 체크
      security: []
      x-transport: http
      x-release: mvp
      x-status: existing
      responses:
        '200':
          description: 서버 정상
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      description: '**상태:** 유지 · **릴리스:** MVP · **전송:** HTTP'
  /users:
    post:
      tags:
      - 사용자와 온보딩
      operationId: registerUser
      summary: 사용자 등록과 세션 발급
      description: |-
        **상태:** 변경 · **릴리스:** MVP · **전송:** HTTP

        서명 쿠키안(OQ-8)에서는 서버가 세션 쿠키를 발급합니다.
      security: []
      x-transport: http
      x-release: mvp
      x-status: changed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              properties:
                user_id:
                  type: string
                  description: FE가 생성한 UUID
      responses:
        '200':
          description: 등록 완료
          headers:
            Set-Cookie:
              schema:
                type: string
              description: httpOnly 서명 세션 쿠키
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /onboarding:
    post:
      tags:
      - 사용자와 온보딩
      operationId: submitOnboarding
      summary: 스토리형 온보딩 응답 제출
      description: |-
        **상태:** 제안 · **릴리스:** MVP · **전송:** HTTP

        현재 `q1~q6`의 한글 문구를 그대로 받아 점수를 계산합니다. 스토리형 문항은 문구가 계속 바뀌므로 안정적인 ID로 받는 방식을 제안합니다(OQ-9).
        기존 총점 범위와 Q1 단기 특칙은 환산표 확정 전까지 유지합니다.
      x-transport: http
      x-release: mvp
      x-status: proposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingSubmission'
      responses:
        '200':
          description: 저장 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{user_id}/context:
    get:
      tags:
      - 사용자와 온보딩
      operationId: readUserContext
      summary: 사용자 투자 성향 조회
      description: |-
        **상태:** 변경 · **릴리스:** MVP · **전송:** HTTP

        세션의 사용자와 일치할 때만 조회합니다.
      x-transport: http
      x-release: mvp
      x-status: changed
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 사용자 컨텍스트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{user_id}/reset:
    delete:
      tags:
      - 사용자와 온보딩
      operationId: resetDemoUser
      summary: 데모 사용자 초기화
      x-transport: http
      x-release: mvp
      x-status: existing
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 초기화 완료
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
