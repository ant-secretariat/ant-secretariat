        impact_pct:
          type: number
        ci_low:
          type: number
        ci_high:
          type: number
        significant:
          type: boolean
          description: 신뢰구간이 0을 포함하면 false이며 방향 불확실로 표시합니다
    SimulationResult:
      type: object
      required:
      - ticker
      - current_price
      - summary
      - quantiles
      - what_if
      - seed
      - model_id
      - data_as_of
      description: 일부 필드명은 제안입니다(OQ-5). 투자 권유로 읽히는 문구는 금지합니다.
      properties:
        ticker:
          $ref: '#/components/schemas/TickerValue'
        current_price:
          type: number
        summary:
          type: object
          required:
          - median_return_pct
          - expected_volatility_annualized
          - var95_pct
          - prob_loss_10pct
          properties:
            median_return_pct:
              type: number
            expected_volatility_annualized:
              type: number
              description: 예상 변동성(모형). σ_30일 × √(252/30)
            var95_pct:
              type: number
            prob_loss_10pct:
              type: number
              description: 30일 내 -10% 이하 확률
        quantiles:
          type: object
          required:
          - p5
          - p25
          - p50
          - p75
          - p95
          properties:
            p5:
              type: number
            p25:
              type: number
            p50:
              type: number
            p75:
              type: number
            p95:
              type: number
        fan_chart:
          type: object
          description: 일자별 분위수 경로입니다.
          additionalProperties:
            type: array
            items:
              type: number
        what_if:
          type: array
          items:
            $ref: '#/components/schemas/SimulationWhatIf'
        historical_volatility_1m:
          type:
          - number
          - 'null'
          description: 과거 변동성(실현). get_derived_snapshot 값을 그대로 사용합니다
        seed:
          type: integer
        model_id:
          type: string
        data_as_of:
          type: string
          format: date
