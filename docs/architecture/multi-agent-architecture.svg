<text x="30" y="1128" font-size="16" fill="#59636E">번호는 요청 1건이 흐르는 순서입니다. 실선은 매 요청, 점선은 조건부(⑦ 사용자가 시뮬레이션 버튼을 누를 때, 관계 사전은 기능 플래그가 켜졌을 때, ⑫ 비동기 추적)입니다.</text>
<text x="30" y="1156" font-size="16" fill="#59636E">흰 바탕 점선 타일(ONT)은 기본 꺼짐 상태입니다. 토론·시뮬레이션은 작업 큐(Q)를 거쳐 워커가 실행하고, 진행 상황은 job_events로 SSE에 전달됩니다(⑬).</text>
